[package]
name = "lurkline"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only Slack CLI and MCP over an existing browser session"
license = "MIT"
repository = "https://github.com/smarzola/lurkline"

[dependencies]
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
fs4 = "1.1"
keyring = "4.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["multipart", "rustls", "stream"] }
rmcp = { version = "2.2", features = ["transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
axum = "0.8"
rmcp = { version = "2.2", features = ["client"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = "3.7"
