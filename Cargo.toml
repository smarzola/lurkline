[package]
name = "lurkline"
version = "0.1.0"
edition = "2024"
description = "Read-only Slack CLI and MCP over an existing browser session"
license = "MIT"
repository = "https://github.com/smarzola/lurkline"

[dependencies]
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"

[dev-dependencies]
axum = "0.8"
